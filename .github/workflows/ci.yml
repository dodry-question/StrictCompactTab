name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript (checkJs)
        run: npm run typecheck

      - name: Tests
        run: npm test
      # Те же проверки, что и локальный `npm run check`, по шагам —
      # чтобы в логе было видно, что именно упало.
