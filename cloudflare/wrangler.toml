name = "strict-compact-tab"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Хранилище: облачные настройки (sync:<slot>) и кеш расписания.
# Создайте namespace командой:
#   npx wrangler kv namespace create SYNC
# и вставьте выданный id вместо заглушки.
[[kv_namespaces]]
binding = "SYNC"
id = "df6072a8dfa645d98bbad31cf6c22cb0"

# Cron сам проверяет стену сообщества. 4 раза в сутки — с запасом для
# недельного расписания и без лишних запросов к VK.
[triggers]
crons = ["17 */6 * * *"]

[vars]
# Сообщество ВК с файлами расписания (owner_id, отрицательный)
VK_OWNER_ID = "-85060840"
# Сколько страниц стены (по 10 постов) просматривать в поисках .xlsx
SCHEDULE_MAX_PAGES = "6"
# Через сколько секунд кеш считается устаревшим для запроса клиента
SCHEDULE_TTL_SECONDS = "3600"
# Максимальный размер шифрованного конверта синхронизации
SYNC_MAX_BYTES = "2097152"
# Максимальный размер .xlsx
SCHEDULE_MAX_BYTES = "12582912"
