<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Новая вкладка</title>
  <!-- Подключение фавиконки вкладки -->
  <link class="page-favicon" rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Блок часов и даты в верхнем левом углу -->
  <div class="clock-container">
    <div id="clock" class="clock">00:00</div>
    <div id="date-display" class="date-display"></div>
  </div>

  <!-- Главный контейнер (сдвинут в верхнюю треть экрана) -->
  <div class="content-wrapper">
    
    <!-- Поисковая строка -->
    <form id="search-form" class="search-form">
      <img class="search-engine-logo" id="search-engine-logo" src="assets/search_duckduckgo.png" alt="">
      <input id="search-input" class="search-input" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="Search..." autofocus autocomplete="off">
      <button type="submit" class="search-btn" data-i18n-title="searchBtnTitle" title="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>
    </form>

    <!-- Горизонтальная панель вкладок-категорий (рендерится только если категорий >= 2) -->
    <div id="main-categories-container" class="main-categories-container"></div>

    <!-- Сетка ярлыков быстрого доступа -->
    <div id="shortcuts-container" class="shortcuts-container"></div>
    
  </div>

  <!-- Невидимая триггер-зона настроек в левом нижнем углу -->
  <div id="settings-trigger-zone" class="settings-trigger-zone">
    <button id="settings-open-btn" class="settings-icon-btn" data-i18n-title="settingsTitle" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <!-- Модальное окно настроек (Двухколоночный макет) -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-i18n="settingsTitle">Screen Settings</h2>
        <button id="settings-close-btn" class="modal-close-icon">&times;</button>
      </div>

      <div class="modal-body">
        
        <!-- ЛЕВАЯ КОЛОНКА (Сверху вниз) -->
        <div class="modal-col-left">
          
          <!-- 1. Добавить новый ярлык -->
          <div class="settings-section">
            <h3 data-i18n="addShortcutTitle">Add New Shortcut</h3>
            <form id="add-shortcut-form" class="add-shortcut-form">
              <input id="new-shortcut-name" type="text" data-i18n-placeholder="namePlaceholder" placeholder="Name" class="settings-input" required autocomplete="off">
              <input id="new-shortcut-url" type="text" data-i18n-placeholder="urlPlaceholder" placeholder="URL Link" class="settings-input" required autocomplete="off">
              
              <!-- Выбор категории при добавлении ярлыка -->
              <div class="settings-field">
                <label for="new-shortcut-category" data-i18n="shortcutCategoryLabel">Category</label>
                <select id="new-shortcut-category" class="settings-select"></select>
              </div>

              <div class="form-actions-row">
                <button type="submit" class="btn btn-add" data-i18n="addBtn">Add</button>
                <label class="btn-square-upload" data-i18n-title="uploadIconTitle" title="Upload custom icon (optional)">
                  <img src="assets/upload-icon.png" alt="Upload">
                  <input id="new-shortcut-icon-file" type="file" accept="image/*" style="display: none;">
                </label>
              </div>
            </form>
          </div>

          <!-- 2. Отображение сетки -->
          <div class="settings-section">
            <h3 data-i18n="gridDisplayTitle">Grid Display</h3>
            <div class="settings-row">
              <div class="settings-field">
                <label for="shortcut-size-select" data-i18n="shortcutSizeLabel">Shortcut Size</label>
                <select id="shortcut-size-select" class="settings-select">
                  <option value="small" data-i18n="sizeSmall">Small (85x85px)</option>
                  <option value="medium" data-i18n="sizeMedium">Medium (98x98px)</option>
                  <option value="large" data-i18n="sizeLarge">Large (110x110px)</option>
                </select>
              </div>
              <div class="settings-field">
                <label for="shortcut-columns-select" data-i18n="columnsLabel">Max in row</label>
                <select id="shortcut-columns-select" class="settings-select">
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                </select>
              </div>
            </div>
            
            <!-- Выбор языка интерфейса -->
            <div class="settings-field">
              <label id="label-language" for="language-select">Language / Язык</label>
              <select id="language-select" class="settings-select">
                <option value="en">English</option>
                <option value="ru">Русский</option>
              </select>
            </div>

            <!-- Выбор поисковой системы -->
            <div class="settings-field">
              <label id="label-search-engine" for="search-engine-select" data-i18n="searchEngineLabel">Search Engine</label>
              <div class="select-with-icon-wrapper">
                <img id="settings-search-logo" class="settings-search-logo" src="assets/search_duckduckgo.png" alt="">
                <select id="search-engine-select" class="settings-select">
                  <option value="duckduckgo">DuckDuckGo</option>
                  <option value="yandex">Yandex</option>
                  <option value="google">Google</option>
                  <option value="brave">Brave</option>
                  <option value="bing">Bing</option>
                  <option value="qwant">Qwant</option>
                  <option value="startpage">Startpage</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 3. Тема оформления / Theme -->
          <div class="settings-section">
            <h3 data-i18n="themeTitle">Theme</h3>
            <div class="settings-field">
              <label for="theme-select" data-i18n="themeLabel">Color Theme</label>
              <select id="theme-select" class="settings-select">
                <option value="dark" data-i18n="themeDark">Dark</option>
                <option value="light" data-i18n="themeLight">Light</option>
              </select>
            </div>
          </div>

          <!-- 4. Фоновое изображение -->
          <div class="settings-section">
            <h3 data-i18n="bgImageTitle">Background Image</h3>
            <div class="settings-row-align">
              <label class="btn btn-file-label">
                <span data-i18n="chooseFileBtn">Choose File</span>
                <input id="bg-file-input" type="file" accept="image/*" style="display: none;">
              </label>
              <button id="bg-reset-btn" class="btn btn-danger-action" data-i18n="resetBtn">Reset</button>
            </div>
          </div>

          <!-- 5. Иконка вкладки (Динамический favicon) -->
          <div class="settings-section">
            <h3 data-i18n="tabFaviconTitle">Tab Favicon</h3>
            <div class="settings-row-align">
              <label class="btn btn-file-label">
                <span data-i18n="chooseIconBtn">Choose Icon</span>
                <input id="favicon-file-input" type="file" accept="image/*" style="display: none;">
              </label>
              <button id="favicon-reset-btn" class="btn btn-danger-action" data-i18n="resetBtn">Reset</button>
            </div>
          </div>

          <!-- 6. Настройки часов и даты -->
          <div class="settings-section">
            <h3 data-i18n="clockDateSettingsTitle">Clock and Date Settings</h3>
            <div class="settings-toggle-group">
              <label class="toggle-label">
                <input type="checkbox" id="show-date-checkbox">
                <span data-i18n="showDateLabel">Show date and day of the week</span>
              </label>
              <label class="toggle-label">
                <input type="checkbox" id="time-format-checkbox">
                <span data-i18n="format12hLabel">12-hour format (AM/PM)</span>
              </label>
              <label class="toggle-label">
                <input type="checkbox" id="show-seconds-checkbox">
                <span data-i18n="showSecondsLabel">Display seconds</span>
              </label>
            </div>
          </div>

          <!-- 7. Резервное копирование -->
          <div class="settings-section">
            <h3 data-i18n="backupTitle">Backup Configuration</h3>
            <div class="settings-row">
              <button id="btn-export" class="btn btn-secondary" data-i18n="exportBtn">Export</button>
              <button id="btn-import" class="btn btn-secondary" data-i18n="importBtn">Import</button>
              <input type="file" id="import-file-input" style="display: none;" accept=".json">
            </div>
          </div>

        </div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div class="modal-col-right">
          <div class="settings-section full-height">
            <h3 data-i18n="manageShortcutsTitle">Manage Shortcuts</h3>
            
            <!-- Ряд управления категориями в настройках -->
            <div class="manage-shortcuts-header-row">
              <div id="settings-categories-tabs" class="settings-categories-tabs"></div>
              <button id="btn-add-category" class="btn-add-category" data-i18n-title="addCategoryTitle" title="Add Category">
                <img src="assets/add-category-icon.png" alt="Add Category">
              </button>
            </div>

            <!-- Список ярлыков выбранной категории -->
            <div id="modal-shortcuts-list" class="modal-shortcuts-list"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
