<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Новая вкладка</title>
  <!-- Подключение фавиконки вкладки -->
  <link class="page-favicon" rel="icon" type="image/png" href="assets/icon16_trans.png">
  <script src="favicon-loader.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Блок часов и даты в верхнем левом углу -->
  <div id="widget-clock" class="clock-container draggable-widget">
    <div id="clock" class="clock">00:00</div>
    <div id="date-display" class="date-display"></div>
  </div>

  <!-- Блок погоды в верхнем правом углу -->
  <div id="weather-widget" class="weather-container draggable-widget" style="display: none;">
    <div class="weather-temp-row">
      <span id="weather-temp" class="weather-temp">--°C</span>
      <span id="weather-icon" class="weather-icon">❓</span>
    </div>
    <div id="weather-details" class="weather-details">--</div>
  </div>

  <!-- Поисковая строка -->
  <form id="search-form" class="search-form draggable-widget">
    <img class="search-engine-logo" id="search-engine-logo" src="assets/search_duckduckgo.png" alt="">
    <input id="search-input" class="search-input" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="Search..." autofocus autocomplete="off">
    <button type="submit" class="search-btn" data-i18n-title="searchBtnTitle" title="Search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </form>

  <!-- Сетка ярлыков быстрого доступа -->
  <div id="widget-shortcuts" class="shortcuts-wrapper draggable-widget">

    <!-- Сетка ярлыков быстрого доступа -->
    <div id="shortcuts-container" class="shortcuts-container"></div>
  </div>

  <!-- Невидимая триггер-зона настроек в левом нижнем углу -->
  <div id="settings-trigger-zone" class="settings-trigger-zone">
    <button id="settings-open-btn" class="settings-icon-btn" data-i18n-title="settingsTitle" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <!-- Модальное окно настроек (Двухколоночный макет) -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div style="display: flex; align-items: baseline; gap: 8px;">
          <h2 data-i18n="settingsTitle" style="margin: 0;">Screen Settings</h2>
          <span class="settings-version" style="font-size: 0.75rem; opacity: 0.5; font-weight: normal; font-family: monospace;">v1.10.7</span>
        </div>
        <button id="settings-close-btn" class="modal-close-icon">&times;</button>
      </div>

      <div class="modal-body">
        
        <!-- ЛЕВАЯ КОЛОНКА (Сверху вниз) -->
        <div class="modal-col-left">
          
          <!-- 1. Добавить новый ярлык -->
          <div class="settings-section">
            <h3 data-i18n="addShortcutTitle">Add New Shortcut</h3>
            <form id="add-shortcut-form" class="add-shortcut-form">
              <input id="new-shortcut-name" type="text" data-i18n-placeholder="namePlaceholder" placeholder="Name" class="settings-input" required autocomplete="off">
              <div class="input-with-icon-upload-wrapper">
                <input id="new-shortcut-url" type="text" data-i18n-placeholder="urlPlaceholder" placeholder="URL Link" class="settings-input" required autocomplete="off">
                <label class="input-icon-upload-label" data-i18n-title="uploadIconTitle" title="Upload custom icon (optional)">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                  <input id="new-shortcut-icon-file" type="file" accept="image/*" style="display: none;">
                </label>
              </div>


              <button type="submit" class="btn btn-add" data-i18n="addBtn">Add</button>
            </form>
          </div>

          <!-- 2. Отображение сетки -->
          <div class="settings-section">
            <h3 data-i18n="gridDisplayTitle">Grid Display</h3>
            <div class="settings-row">
              <div class="settings-field">
                <label for="shortcut-size-select" data-i18n="shortcutSizeLabel">Shortcut Size</label>
                <select id="shortcut-size-select" class="settings-select">
                  <option value="small" data-i18n="sizeSmall">Small (85x85px)</option>
                  <option value="medium" data-i18n="sizeMedium">Medium (98x98px)</option>
                  <option value="large" data-i18n="sizeLarge">Large (110x110px)</option>
                </select>
              </div>
              <div class="settings-field">
                <label for="shortcut-columns-select" data-i18n="columnsLabel">Max in row</label>
                <select id="shortcut-columns-select" class="settings-select">
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                </select>
              </div>
            </div>
            
            <!-- Переключатель режима виджетов iOS -->
            <div class="settings-field ios-mode-field">
              <label class="toggle-label">
                <input type="checkbox" id="layout-ios-mode">
                <span data-i18n="iosModeLabel">iOS Widget Mode (Square tiles)</span>
              </label>
            </div>



            <!-- Стелс-режим (Ультра-минимализм) -->
            <div class="settings-field stealth-mode-field">
              <label class="toggle-label">
                <input type="checkbox" id="layout-stealth-mode">
                <span data-i18n="stealthModeLabel">Stealth Mode (Ultra-minimalism)</span>
              </label>
            </div>

            <!-- Дзен-режим (Чистый экран) -->
            <div class="settings-field zen-mode-field">
              <label class="toggle-label">
                <input type="checkbox" id="layout-zen-mode">
                <span data-i18n="zenModeLabel">Zen Mode (Only wallpaper & settings)</span>
              </label>
            </div>

            <!-- Проверка обновлений (GitHub) -->
            <div class="settings-field update-check-field">
              <label class="toggle-label">
                <input type="checkbox" id="check-updates-checkbox">
                <span data-i18n="checkUpdatesLabel">Check for updates (GitHub)</span>
              </label>
            </div>

            <!-- Выбор языка интерфейса -->
            <div class="settings-field">
              <label id="label-language" for="language-select">Language / Язык</label>
              <select id="language-select" class="settings-select">
                <option value="en">English</option>
                <option value="ru">Русский</option>
              </select>
            </div>

            <!-- Выбор поисковой системы -->
            <div class="settings-field" style="margin-bottom: 8px;">
              <label id="label-search-engine" for="search-engine-select" data-i18n="searchEngineLabel">Search Engine</label>
              <div class="select-with-icon-wrapper">
                <img id="settings-search-logo" class="settings-search-logo" src="assets/search_duckduckgo.png" alt="">
                <select id="search-engine-select" class="settings-select">
                  <option value="duckduckgo">DuckDuckGo</option>
                  <option value="yandex">Yandex</option>
                  <option value="google">Google</option>
                  <option value="brave">Brave</option>
                  <option value="bing">Bing</option>
                  <option value="qwant">Qwant</option>
                  <option value="startpage">Startpage</option>
                </select>
              </div>
            </div>

            <!-- Раздел управления своими поисковиками -->
            <div class="custom-engines-section" style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
              <button type="button" id="btn-toggle-custom-engines" class="btn btn-secondary" style="font-size: 0.8rem; padding: 6px;" data-i18n="manageCustomEnginesBtn">Manage Engines</button>
              <div id="custom-engines-panel" class="custom-engines-panel" style="display: none; flex-direction: column; gap: 8px; border: 1px solid var(--border-color, #444); padding: 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.02);">
                <div id="custom-engines-list" class="custom-engines-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto;"></div>
                
                <form id="add-custom-engine-form" class="add-custom-engine-form" style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px; border-top: 1px dashed var(--border-color, #444); padding-top: 8px;">
                  <div style="font-weight: 600; font-size: 0.85rem;" data-i18n="addCustomEngineTitle">Add Custom Engine</div>
                  <input id="custom-engine-name" type="text" data-i18n-placeholder="customEngineNamePlaceholder" placeholder="Engine Name" class="settings-input" required autocomplete="off">
                  <input id="custom-engine-query" type="text" data-i18n-placeholder="customEngineQueryPlaceholder" placeholder="Query URL" class="settings-input" required autocomplete="off">
                  
                  <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between;">
                    <label class="btn btn-file-label" style="font-size: 0.75rem; padding: 4px 8px; margin: 0; cursor: pointer;">
                      <span data-i18n="chooseLogoBtn">Choose Logo</span>
                      <input id="custom-engine-logo-file" type="file" accept="image/*" style="display: none;">
                    </label>
                    <span id="custom-engine-logo-status" style="font-size: 0.75rem; opacity: 0.7; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                  </div>
                  <button type="submit" class="btn btn-add" style="padding: 6px; font-size: 0.8rem; width: 100%;" data-i18n="addBtn">Add</button>
                </form>
              </div>
            </div>
          </div>

          <!-- 3. Тема оформления / Theme -->
          <div class="settings-section">
            <h3 data-i18n="themeTitle">Theme</h3>
            <div class="settings-field">
              <label for="theme-select" data-i18n="themeLabel">Color Theme</label>
              <select id="theme-select" class="settings-select">
                <option value="dark" data-i18n="themeDark">Dark</option>
                <option value="light" data-i18n="themeLight">Light</option>
                <option value="adaptive" data-i18n="themeAdaptive">Adaptive</option>
              </select>
            </div>
          </div>

          <!-- 4. Фоновое изображение -->
          <div class="settings-section">
            <h3 data-i18n="bgImageTitle">Background Image</h3>
            <div class="settings-row-align">
              <label class="btn btn-file-label">
                <span data-i18n="chooseFileBtn">Choose File</span>
                <input id="bg-file-input" type="file" accept="image/*" style="display: none;">
              </label>
              <button id="bg-reset-btn" class="btn btn-danger-action" data-i18n="resetBtn">Reset</button>
            </div>
          </div>

          <!-- 5. Иконка вкладки (Динамический favicon) -->
          <div class="settings-section">
            <h3 data-i18n="tabFaviconTitle">Tab Favicon</h3>
            <div class="settings-row-align">
              <label class="btn btn-file-label">
                <span data-i18n="chooseIconBtn">Choose Icon</span>
                <input id="favicon-file-input" type="file" accept="image/*" style="display: none;">
              </label>
              <button id="favicon-reset-btn" class="btn btn-danger-action" data-i18n="resetBtn">Reset</button>
            </div>
          </div>

          <!-- 6. Настройки часов и даты -->
          <div class="settings-section">
            <h3 data-i18n="clockDateSettingsTitle">Clock and Date Settings</h3>
            <div class="settings-toggle-group">
              <label class="toggle-label">
                <input type="checkbox" id="show-clock-checkbox">
                <span data-i18n="showClockLabel">Show Clock and Date</span>
              </label>
              
              <!-- Подразделы настроек часов, видимые только когда часы включены -->
              <div id="clock-subsettings" class="settings-toggle-group settings-subsettings" style="display: flex;">
                <label class="toggle-label">
                  <input type="checkbox" id="show-date-checkbox">
                  <span data-i18n="showDateLabel">Show date and day of the week</span>
                </label>
                <label class="toggle-label">
                  <input type="checkbox" id="time-format-checkbox">
                  <span data-i18n="format12hLabel">12-hour format (AM/PM)</span>
                </label>
                <label class="toggle-label">
                  <input type="checkbox" id="show-seconds-checkbox">
                  <span data-i18n="showSecondsLabel">Display seconds</span>
                </label>
              </div>
            </div>
          </div>

          <!-- 7. Настройки погоды -->
          <div class="settings-section">
            <h3 data-i18n="weatherSettingsTitle">Weather Settings</h3>
            <div class="settings-toggle-group">
              <label class="toggle-label">
                <input type="checkbox" id="show-weather-checkbox">
                <span data-i18n="showWeatherLabel">Show Weather Widget</span>
              </label>
              
              <!-- Подразделы настроек погоды -->
              <div id="weather-subsettings" class="settings-toggle-group settings-subsettings" style="display: none;">
                <div class="settings-field">
                  <label for="weather-city-input" data-i18n="weatherCityLabel">City</label>
                  <input id="weather-city-input" type="text" data-i18n-placeholder="weatherCityPlaceholder" placeholder="Enter city (e.g., Moscow, Moscow Oblast, RU)" class="settings-input">
                  <div id="weather-input-status" class="weather-input-status"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 8. Расположение элементов -->
          <div class="settings-section">
            <h3 data-i18n="layoutTitle">Layout</h3>
            <div class="settings-row">
              <button id="btn-edit-layout" class="btn btn-secondary" data-i18n="editLayoutBtn">Edit Layout</button>
              <button id="btn-reset-layout" class="btn btn-danger-action" data-i18n="resetLayoutBtn">Reset Layout</button>
            </div>
          </div>

          <!-- 9. Резервное копирование -->
          <div class="settings-section">
            <h3 data-i18n="backupTitle">Backup Configuration</h3>
            <div class="settings-row">
              <button id="btn-export" class="btn btn-secondary" data-i18n="exportBtn">Export</button>
              <button id="btn-import" class="btn btn-secondary" data-i18n="importBtn">Import</button>
              <input type="file" id="import-file-input" style="display: none;" accept=".json">
            </div>
          </div>

        </div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div class="modal-col-right">
          <div class="settings-section full-height">
            <h3 data-i18n="manageShortcutsTitle">Manage Shortcuts</h3>
            


            <!-- Список ярлыков выбранной категории -->
            <div id="modal-shortcuts-list" class="modal-shortcuts-list"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Панель управления редактированием макета -->
  <div id="layout-edit-controls" class="layout-controls-panel" style="display: none;">
    <div class="layout-control-group">
      <label class="layout-control-label">
        <input type="checkbox" id="layout-grid-snap">
        <span data-i18n="gridSnapLabel">Snap to Grid</span>
      </label>
      <select id="layout-grid-size" class="layout-grid-select" style="display: none; margin-left: 8px;">
        <option value="10">10px</option>
        <option value="20" selected>20px</option>
        <option value="30">30px</option>
        <option value="40">40px</option>
        <option value="50">50px</option>
      </select>
    </div>
    <div class="layout-control-divider"></div>
    <button id="layout-save-btn" class="btn btn-add" data-i18n="saveBtn">Save</button>
    <button id="layout-cancel-btn" class="btn btn-secondary" data-i18n="btnCancel">Cancel</button>
  </div>

  <!-- Уведомление о новой версии расширения -->
  <div id="update-notification" class="update-notification" style="display: none;">
    <span id="update-text">New version available: 1.10.7</span>
    <a id="update-link" href="https://github.com/dodry-question/my-new-tab/releases" target="_blank" data-i18n="updateDownload">Download</a>
  </div>

  <!-- Модальное окно открытой папки -->
  <div id="folder-modal" class="folder-modal-overlay">
    <div class="folder-modal-content">
      <div class="folder-modal-header">
        <h3 id="folder-modal-title">Folder Name</h3>
        <button id="folder-modal-close" class="modal-close-icon">&times;</button>
      </div>
      <div id="folder-shortcuts-container" class="shortcuts-container"></div>
    </div>
  </div>

  <script src="assets/material-color-utilities.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
