<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Новая вкладка</title>
  <!-- Подключение фавиконки вкладки -->
  <link class="page-favicon" rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Блок часов и даты в верхнем левом углу -->
  <div class="clock-container">
    <div id="clock" class="clock">00:00</div>
    <div id="date-display" class="date-display"></div>
  </div>

  <!-- Главный контейнер (сдвинут в верхнюю треть экрана) -->
  <div class="content-wrapper">
    
    <!-- Поисковая строка DuckDuckGo -->
    <form id="search-form" class="search-form">
      <!-- Иконка DuckDuckGo заменена на локальное стабильное изображение -->
      <img src="duckduckgo.png" class="search-engine-logo" alt="">
      <input id="search-input" class="search-input" type="text" placeholder="Искать в интернете..." autofocus autocomplete="off">
      <button type="submit" class="search-btn" title="Искать">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </button>
    </form>

    <!-- Сетка ярлыков быстрого доступа -->
    <div id="shortcuts-container" class="shortcuts-container"></div>
    
  </div>

  <!-- Невидимая триггер-зона настроек в левом нижнем углу -->
  <div id="settings-trigger-zone" class="settings-trigger-zone">
    <button id="settings-open-btn" class="settings-icon-btn" title="Настройки макета">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <!-- Модальное окно настроек (Двухколоночный макет) -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Настройки экрана</h2>
        <button id="settings-close-btn" class="modal-close-icon">&times;</button>
      </div>

      <div class="modal-body">
        
        <!-- ЛЕВАЯ КОЛОНКА (Сверху вниз) -->
        <div class="modal-col-left">
          
          <!-- 1. Добавить новый ярлык -->
          <div class="settings-section">
            <h3>Добавить новый ярлык</h3>
            <form id="add-shortcut-form" class="add-shortcut-form">
              <input id="new-shortcut-name" type="text" placeholder="Название" class="settings-input" required autocomplete="off">
              <input id="new-shortcut-url" type="text" placeholder="Ссылка URL" class="settings-input" required autocomplete="off">
              <button type="submit" class="btn btn-add">Добавить</button>
            </form>
          </div>

          <!-- 2. Отображение сетки -->
          <div class="settings-section">
            <h3>Отображение сетки</h3>
            <div class="settings-row">
              <div class="settings-field">
                <label for="shortcut-size-select">Размер ярлыков</label>
                <select id="shortcut-size-select" class="settings-select">
                  <option value="small">Маленький (85x85px)</option>
                  <option value="medium">Средний (98x98px)</option>
                  <option value="large">Крупный (110x110px)</option>
                </select>
              </div>
              <div class="settings-field">
                <label for="shortcut-columns-select">В ряду (макс.)</label>
                <select id="shortcut-columns-select" class="settings-select">
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 3. Фоновое изображение -->
          <div class="settings-section">
            <h3>Фоновое изображение</h3>
            <div class="settings-row-align">
              <label class="btn btn-file-label">
                Выбрать файл
                <input id="bg-file-input" type="file" accept="image/*" style="display: none;">
              </label>
              <button id="bg-reset-btn" class="btn btn-danger-action">Сбросить</button>
            </div>
          </div>

          <!-- 4. Настройки часов и даты -->
          <div class="settings-section">
            <h3>Настройки часов и даты</h3>
            <div class="settings-toggle-group">
              <label class="toggle-label">
                <input type="checkbox" id="show-date-checkbox">
                <span>Показывать дату и день недели</span>
              </label>
              <label class="toggle-label">
                <input type="checkbox" id="time-format-checkbox">
                <span>12-часовой формат (AM/PM)</span>
              </label>
              <label class="toggle-label">
                <input type="checkbox" id="show-seconds-checkbox">
                <span>Отображать секунды</span>
              </label>
            </div>
          </div>

          <!-- 5. Резервное копирование -->
          <div class="settings-section">
            <h3>Резервное копирование</h3>
            <div class="settings-row">
              <button id="btn-export" class="btn btn-secondary">Экспорт</button>
              <button id="btn-import" class="btn btn-secondary">Импорт</button>
              <!-- Скрытый статический инпут бэкапа -->
              <input type="file" id="import-file-input" style="display: none;" accept=".json">
            </div>
          </div>

        </div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div class="modal-col-right">
          <div class="settings-section full-height">
            <h3>Управление ярлыками</h3>
            <div id="modal-shortcuts-list" class="modal-shortcuts-list"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
